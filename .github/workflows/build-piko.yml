name: Build latest X with Piko

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "X version, e.g. 12.19.1-release.0 (blank = latest APKMirror release)"
        required: false
        type: string
      force:
        description: "Build even when the release tag already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: piko-release-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: sdkmanager "build-tools;35.0.0"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve X version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED='${{ inputs.version }}'
          if [[ -n "$REQUESTED" ]]; then
            VERSION="$REQUESTED"
          else
            VERSION="$(python scripts/apkmirror.py latest)"
          fi

          if [[ "$VERSION" != *release* ]]; then
            echo "Refusing non-release version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved X version: $VERSION"

      - name: Check whether release already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when already published
        if: steps.existing.outputs.exists == 'true' && inputs.force != true
        run: echo "Nothing to do; this version is already published."

      - name: Prepare custom signing key
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!NAME:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $NAME"
              exit 1
            fi
          done

          mkdir -p work dist
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > work/signing.keystore
          test -s work/signing.keystore

          keytool -list \
            -keystore work/signing.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Custom Android signing key loaded successfully."

      - name: Download original APKM from APKMirror
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apkmirror.py download '${{ steps.version.outputs.version }}' work/x.apkm
          test -s work/x.apkm

      - name: Download latest stable Morphe CLI
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        id: morphe
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api repos/MorpheApp/morphe-desktop/releases/latest)"
          TAG="$(jq -r '.tag_name' <<<"$RELEASE_JSON")"
          URL="$(jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' <<<"$RELEASE_JSON" | head -n1)"
          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "Could not resolve Morphe CLI asset" >&2
            exit 1
          fi
          curl --fail --location --retry 4 --retry-delay 5 "$URL" -o morphe.jar
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve latest stable Piko release
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        id: piko
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api repos/crimera/piko/releases/latest)"
          TAG="$(jq -r '.tag_name' <<<"$RELEASE_JSON")"
          URL="$(jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' <<<"$RELEASE_JSON" | head -n1)"
          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "Could not resolve Piko .mpp asset" >&2
            exit 1
          fi
          curl --fail --location --retry 4 --retry-delay 5 "$URL" -o piko.mpp
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and sign all variants
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          VARIANTS=(twitter-material twitter x-material x)
          ARCHES=(universal arm64-v8a armeabi-v7a x86 x86_64)

          for VARIANT in "${VARIANTS[@]}"; do
            case "$VARIANT" in
              twitter-material)
                PATCH_FLAGS=(-e "Bring back twitter" -e "Dynamic color")
                ;;
              twitter)
                PATCH_FLAGS=(-e "Bring back twitter" -d "Dynamic color")
                ;;
              x-material)
                PATCH_FLAGS=(-d "Bring back twitter" -e "Dynamic color")
                ;;
              x)
                PATCH_FLAGS=(-d "Bring back twitter" -d "Dynamic color")
                ;;
            esac

            for ARCH in "${ARCHES[@]}"; do
              echo "Building ${VARIANT} / ${ARCH}..."
              STRIP_FLAGS=()
              if [[ "$ARCH" != "universal" ]]; then
                STRIP_FLAGS=(--striplibs "$ARCH")
              fi

              UNSIGNED="work/${VARIANT}-${ARCH}-unsigned.apk"
              ALIGNED="work/${VARIANT}-${ARCH}-aligned.apk"
              FINAL="dist/x-piko-${VERSION}-${VARIANT}-${ARCH}.apk"

              java -jar morphe.jar patch \
                --patches piko.mpp \
                "${PATCH_FLAGS[@]}" \
                "${STRIP_FLAGS[@]}" \
                --unsigned \
                --out "$UNSIGNED" \
                work/x.apkm

              "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"

              "$APKSIGNER" sign \
                --ks work/signing.keystore \
                --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
                --key-pass env:ANDROID_KEY_PASSWORD \
                --out "$FINAL" \
                "$ALIGNED"

              "$APKSIGNER" verify --verbose "$FINAL"
              rm -f "$UNSIGNED" "$ALIGNED"
            done
          done

      - name: Validate build outputs
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [[ "$COUNT" -ne 20 ]]; then
            echo "Expected 20 APKs, found $COUNT" >&2
            exit 1
          fi

          for FILE in dist/*.apk; do
            test -s "$FILE"
            unzip -tq "$FILE" >/dev/null
            sha256sum "$FILE"
          done

      - name: Replace existing release when force rebuilding
        if: steps.existing.outputs.exists == 'true' && inputs.force == true
        shell: bash
        run: gh release delete '${{ steps.version.outputs.version }}' --yes --cleanup-tag

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          cat > release-notes.md <<EOF
          Automated X/Twitter build patched with Piko and signed with the repository owner's Android signing key.

          - X: \`${VERSION}\`
          - Piko: \`${{ steps.piko.outputs.tag }}\`
          - Morphe: \`${{ steps.morphe.outputs.tag }}\`
          - Source APKM: APKMirror universal bundle

          UI / branding variants:
          - \`twitter-material\`: Twitter branding + Material You dynamic color
          - \`twitter\`: Twitter branding + standard Twitter/X colors
          - \`x-material\`: X branding + Material You dynamic color
          - \`x\`: X branding + standard Twitter/X colors

          Architecture variants for every UI / branding variant:
          - \`arm64-v8a\`: most modern Android phones
          - \`armeabi-v7a\`: older 32-bit ARM devices
          - \`x86_64\`: 64-bit Intel emulators / Chromebooks
          - \`x86\`: legacy 32-bit Intel emulators
          - \`universal\`: keeps all native architectures

          Total: 4 UI / branding variants × 5 architecture variants = 20 APKs.
          EOF

          gh release create "$VERSION" dist/*.apk \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --latest
