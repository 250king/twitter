name: Build latest X with Piko NewX

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "X version supported by latest stable Piko NewX (blank = newest supported version)"
        required: false
        type: string
      force:
        description: "Build even when the release tag already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: piko-newx-release-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve latest Piko NewX and Morphe CLI
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          PIKO_JSON="$(gh api repos/crimera/piko-newx/releases/latest)"
          PIKO_TAG="$(jq -r '.tag_name' <<<"$PIKO_JSON")"
          PIKO_URL="$(jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' <<<"$PIKO_JSON" | head -n1)"

          if [[ -z "$PIKO_URL" || "$PIKO_URL" == "null" ]]; then
            echo "::error::Could not resolve Piko NewX .mpp asset"
            exit 1
          fi

          MORPHE_JSON="$(gh api repos/MorpheApp/morphe-desktop/releases/latest)"
          MORPHE_TAG="$(jq -r '.tag_name' <<<"$MORPHE_JSON")"
          MORPHE_URL="$(jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' <<<"$MORPHE_JSON" | head -n1)"

          if [[ -z "$MORPHE_URL" || "$MORPHE_URL" == "null" ]]; then
            echo "::error::Could not resolve Morphe CLI asset"
            exit 1
          fi

          curl --fail --location --retry 4 --retry-delay 5 "$MORPHE_URL" -o morphe.jar
          curl --fail --location --retry 4 --retry-delay 5 "$PIKO_URL" -o piko.mpp
          test -s morphe.jar
          test -s piko.mpp

          {
            echo "piko_tag=$PIKO_TAG"
            echo "morphe_tag=$MORPHE_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Piko NewX ${PIKO_TAG}; Morphe ${MORPHE_TAG}"

      - name: Resolve supported X version
        id: target
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          mapfile -t TARGETS < <(
            java -jar morphe.jar list-versions --patches piko.mpp -f com.twitter.android \
              | sed -nE 's/^[[:space:]]*([^[:space:]]+)[[:space:]]+\([0-9]+ patches?\)[[:space:]]*$/\1/p'
          )

          if (( ${#TARGETS[@]} == 0 )); then
            echo "::error::Piko NewX ${{ steps.upstream.outputs.piko_tag }} exposes no stable X target"
            exit 1
          fi

          if [[ -n "$REQUESTED_VERSION" ]]; then
            if ! printf '%s\n' "${TARGETS[@]}" | grep -Fxq "$REQUESTED_VERSION"; then
              echo "::error::X ${REQUESTED_VERSION} is not supported by Piko NewX ${{ steps.upstream.outputs.piko_tag }}"
              echo "Supported: ${TARGETS[*]}"
              exit 1
            fi
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$(printf '%s\n' "${TARGETS[@]}" | sort -V | tail -n1)"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Piko NewX ${{ steps.upstream.outputs.piko_tag }} -> X $VERSION"

      - name: Check whether release already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.target.outputs.version }}'
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when already published
        if: steps.existing.outputs.exists == 'true' && inputs.force != true
        run: echo "Nothing to do; this version is already published."

      - name: Set up Python
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Android SDK
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        run: sdkmanager "build-tools;35.0.0"

      - name: Install Python dependencies
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        run: pip install -r requirements.txt

      - name: Prepare custom signing key
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!NAME:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $NAME"
              exit 1
            fi
          done

          mkdir -p work dist
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > work/signing.keystore
          test -s work/signing.keystore

          keytool -list \
            -keystore work/signing.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Custom Android signing key loaded successfully."

      - name: Download original APKM from APKMirror
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apkmirror.py download '${{ steps.target.outputs.version }}' work/x.apkm
          test -s work/x.apkm
          unzip -tq work/x.apkm >/dev/null

      - name: Build and sign all variants
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.target.outputs.version }}'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          BRANDS=(twitter x)
          ARCHES=(universal arm64-v8a armeabi-v7a)

          for BRAND in "${BRANDS[@]}"; do
            case "$BRAND" in
              twitter)
                PATCH_FLAGS=(-e "NewX: Restore Twitter branding")
                ;;
              x)
                PATCH_FLAGS=(-d "NewX: Restore Twitter branding")
                ;;
            esac

            for ARCH in "${ARCHES[@]}"; do
              echo "Building ${BRAND} / ${ARCH}..."
              STRIP_FLAGS=()
              if [[ "$ARCH" != "universal" ]]; then
                STRIP_FLAGS=(--striplibs "$ARCH")
              fi

              UNSIGNED="work/${BRAND}-${ARCH}-unsigned.apk"
              ALIGNED="work/${BRAND}-${ARCH}-aligned.apk"
              FINAL="dist/x-piko-${VERSION}-${BRAND}-${ARCH}.apk"

              java -jar morphe.jar patch \
                --patches piko.mpp \
                "${PATCH_FLAGS[@]}" \
                "${STRIP_FLAGS[@]}" \
                --unsigned \
                --out "$UNSIGNED" \
                work/x.apkm

              "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"

              "$APKSIGNER" sign \
                --ks work/signing.keystore \
                --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
                --key-pass env:ANDROID_KEY_PASSWORD \
                --out "$FINAL" \
                "$ALIGNED"

              "$APKSIGNER" verify --verbose "$FINAL"
              rm -f "$UNSIGNED" "$ALIGNED"
            done
          done

      - name: Validate build outputs
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [[ "$COUNT" -ne 6 ]]; then
            echo "Expected 6 APKs, found $COUNT" >&2
            exit 1
          fi

          for FILE in dist/*.apk; do
            test -s "$FILE"
            unzip -tq "$FILE" >/dev/null
            sha256sum "$FILE"
          done

      - name: Replace existing release when force rebuilding
        if: steps.existing.outputs.exists == 'true' && inputs.force == true
        shell: bash
        run: gh release delete '${{ steps.target.outputs.version }}' --yes --cleanup-tag

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true' || inputs.force == true
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.target.outputs.version }}'
          cat > release-notes.md <<EOF
          Automated X/Twitter build patched with the Piko NewX bundle and signed with the repository owner's Android signing key.

          - X: \`${VERSION}\`
          - Piko NewX: \`${{ steps.upstream.outputs.piko_tag }}\`
          - Morphe: \`${{ steps.upstream.outputs.morphe_tag }}\`
          - Source APKM: APKMirror ARM bundle (arm64-v8a + armeabi-v7a)

          Branding variants:
          - \`twitter\`: Twitter name and icons restored
          - \`x\`: default X branding

          Architecture variants for every branding variant:
          - \`arm64-v8a\`: most modern Android phones
          - \`armeabi-v7a\`: older 32-bit ARM devices
          - \`universal\`: keeps both ARM architectures

          Material You and the other themes are runtime settings. Open the patched app's Piko settings, then Appearance -> Theme. They are not separate APKs.

          X 12.38+ no longer ships x86 / x86_64 native libraries, so no x86 emulator builds are produced.

          Total: 2 branding variants × 3 architecture variants = 6 APKs.
          EOF

          gh release create "$VERSION" dist/*.apk \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --latest
